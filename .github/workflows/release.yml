# Release the package when a version tag is pushed: run the tests, build the
# package and create a GitHub release with the notes from CHANGELOG.md

name: Release

on:
  push:
    tags: [ "*" ]

jobs:
  test:
    uses: ./.github/workflows/python-package.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.x"
    - name: Check that the tag matches the package version
      run: |
        version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
        if [ "$version" != "$GITHUB_REF_NAME" ]; then
          echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in pyproject.toml"
          exit 1
        fi
    - name: Extract release notes from CHANGELOG.md
      run: |
        awk -v tag="$GITHUB_REF_NAME" '
          /^## \[/ { found = index($0, "## [" tag "]") == 1; next }
          /^\[.*\]: / { next }
          found
        ' CHANGELOG.md > notes.md
        if ! grep -q '[^[:space:]]' notes.md; then
          echo "::error::No section for $GITHUB_REF_NAME in CHANGELOG.md"
          exit 1
        fi
        cat notes.md
    - name: Build package
      run: |
        python -m pip install --upgrade build
        python -m build
    - name: Create release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
